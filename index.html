const H=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));

const HN=[[15,"Red"],[40,"Orange"],[65,"Yellow"],[90,"Lime"],[165,"Green"],[195,"Teal"],[255,"Blue"],[290,"Purple"],[345,"Pink"],[361,"Red"]];

 if(l>.93)return["White","core"];if(l<.09)return["Black","core"];

 const hn=HN.find(x=>h<x[0])[1];

const TY={shirt:["tshirt","polo","buttonup"],pants:["jeans","trousers","chinos","cargo","joggers","shorts"],jacket:["blazer","leather","bomber","hoodie","denim","puffer","coat"]};

function meta(it){const[n,f]=nm(it.hex),c=hsl(H(it.hex));
 if(it.type=="jeans"&&f=="col"&&c.h>195&&c.h<255&&c.l<.6&&c.s<.65)return{...c,n:it.name||"Denim",k:n,f:"denim"};return{...c,n:it.name||n,k:n,f}}
function pair(a,b){const dh=Math.min(Math.abs(a.h-b.h),360-Math.abs(a.h-b.h)),dl=Math.abs(a.l-b.l),has=f=>a.f==f||b.f==f,k2=(x,y)=>(a.k==x&&b.k==y)||(a.k==y&&b.k==x),ak=(...L)=>L.includes(a.k)||L.includes(b.k),loud=m=>m.f=="col"&&m.s>.7&&m.l>.35&&m.l<.7;let s;
 if(a.f=="core"&&b.f=="core")s=a.k==b.k?5:k2("Black","White")?8.5:(a.l<.3&&b.l<.3)||dl<.15?5.5:7.5;
 else if(has("core")){const c=a.f=="core"?a:b,o=a.f=="core"?b:a;s=8.5;if(loud(o))s=c.k=="Black"?8:6.5;if(c.k=="Black"&&o.l<.2)s=5.5}

 else if(a.f=="earth"&&b.f=="earth"){s=6;if(ak("Navy")&&ak("Beige","Cream","Khaki","Tan"))s=9;else if(k2("Brown","Cream")||k2("Brown","Beige")||k2("Olive","Cream")||k2("Olive","Beige"))s=8.5;else if(a.k==b.k)s=dl>.25?7:4;else if(k2("Navy","Brown")||k2("Navy","Olive"))s=5}
 else if(has("earth")){const e=a.f=="earth"?a:b,o=a.f=="earth"?b:a;s=e.k=="Navy"||e.l>.65?8:e.k=="Brown"?6.5:e.k=="Olive"?6:7;if(loud(o))s-=1;if(e.k=="Navy"&&o.l<.3)s=5}
 else{s=dh<25?(dl>.25?8:5.5):dh>155&&dh<205?(Math.min(a.s,b.s)<.45?6.5:4.5):5;if(a.s>.6&&b.s>.6)s-=2;if(dl>.25&&dh>=25)s+=.5}

const SKIN={fair:m=>(m.h>=170&&m.h<=300&&m.s>.25)||["Navy","Maroon"].includes(m.k),wheatish:m=>["Olive","Teal","Maroon","Navy","Cream"].includes(m.k)||(m.h>190&&m.h<260&&m.s>.3),olive:m=>["Cream","Maroon","Teal","Navy"].includes(m.k)||(m.f=="col"&&m.h>80&&m.h<170),dark:m=>m.l>.72||(m.f=="col"&&m.s>.6&&m.l>.4)};

function rate(a,b,o,pf){const A=meta(a),B=meta(b);let s=pair(A,B);const ps=x=>x.pat&&x.pat!="solid";
 if(ps(a)&&ps(b))s-=1.5;else if(ps(a)&&A.f!="core"&&B.f!="core"&&B.s>.3)s-=.5;
 const f1=FM[a.type],f2=FM[b.type],fm=(f1+f2)/2,need={office:2.2,wedding:2.6,eid:2}[o]||0;
 if(fm<need)s-=(need-fm)*2;if(Math.abs(f1-f2)>=2.5)s-=1;

 if(o=="office"){if(loud(A))s-=1.5;if(loud(B))s-=1.5}
 if(o=="wedding"){if(["White","Cream","Maroon","Navy","Black"].includes(A.k)||(A.f=="col"&&A.l<.3))s+=.7;if((B.f=="core"&&B.l<.3)||B.k=="Navy"||B.k=="Beige")s+=.7;if(["Mustard","Olive"].includes(A.k))s-=1}

const tier=r=>r>=8.5?"Great match":r>=7?"Good match":r>=5.5?"Okay":"Clashes";
const SH={Black:["Black","White or black sneakers","Black slides"],White:["Brown, tan or black","White or beige sneakers","Tan sandals"],Grey:["Black or dark brown","White or grey sneakers","Black or brown sandals"],Navy:["Brown, tan or burgundy","White sneakers","Brown or tan sandals"],Beige:["Brown, tan or navy","White or brown sneakers","Brown sandals"],Brown:["Dark brown or black","White or tan sneakers","Brown sandals"],Olive:["Brown or black","White or brown sneakers","Brown or tan sandals"],Maroon:["Black or dark brown","White or black sneakers","Black sandals"],_:["Black or brown","White sneakers","Black or brown sandals"]};
const SK={Charcoal:"Grey","Dark Grey":"Grey","Light Grey":"Grey",Khaki:"Beige",Cream:"Beige",Tan:"Beige",Green:"Olive",Red:"Maroon",Blue:"Navy",Teal:"Navy",Mustard:"Brown"};
function shoes(m,o){const k=m.k.replace(/^(Dark|Light) /,""),s=SH[SK[k]||k]||SH[m.f=="denim"?"Navy":"_"],L=[["Formal shoes",s[0]],["Sneakers",s[1]],["Sandals / slides",s[2]]];

const jr=(j,s,p,o)=>{const J=meta(j);let v=(pair(J,meta(s))+pair(J,meta(p)))/2;if(o=="office"||o=="wedding")v-=Math.max(0,2.5-FM[j.type])*1.2;return Math.round(v*10)/10};
/*UI*/
const db=new Promise(r=>{const q=indexedDB.open("fc",1);q.onupgradeneeded=()=>q.result.createObjectStore("s");q.onsuccess=()=>r(q.result)});

const num=r=>`<div class=big2 style="color:${rc(r)}">${r}<small>/10</small></div>`;

function chkView(){const row=(k,t)=>`<div class=row><input type=color value="${chk[k].hex}" onchange="chk.${k}.hex=this.value;R()"><select style="width:auto" onchange="chk.${k}.type=this.value;R()">${TY[t].map(x=>`<option value=${x} ${chk[k].type==x?"selected":""}>${LB[x]}</option>`).join("")}</select><b>${meta(chk[k]).n}</b></div>`;
 const r=rate(chk.a,chk.b,S.occ,S.pf);return`<h1>Check</h1><p class=sub>Test any two colors without photos</p>`+occ()+`<h3>Shirt</h3>${row("a","shirt")}<h3>Pants</h3>${row("b","pants")}<div class=card>${num(r)}<p class=mu>${tier(r)}</p>${shoes(meta(chk.b),S.occ)}</div>`}
function wardView(){return`<h1>Wardrobe</h1>`+seg([["shirt","Shirts "+I("shirt").length],["pants","Pants "+I("pants").length],["jacket","Jackets "+I("jacket").length]],wsec,"setW")+`<button class=pri onclick="$('#f').click()" style="margin:0">Add photos</button>
 <p class=mu>${hasAI()?"Photos appear instantly. AI reads the color and type in the background.":"Add an AI key in Settings so colors are read automatically."}</p>
 <div class=grid>${I(wsec).map(i=>`<div class="it ${i.st?"scan":""}" onclick="edit(${i.id})"><img src="${i.img}"><small><i class=dot style="background:${i.hex}"></i> ${i.st?"Scanning...":n2(i)}</small><button class=x onclick="event.stopPropagation();del(${i.id})">×</button></div>`).join("")}</div>`}
function setView(){const ch=(k,L)=>`<div class=row>${L.map(v=>`<button class="chip ${S.pf[k]==v?"on":""}" onclick="S.pf['${k}']=S.pf['${k}']=='${v}'?'':'${v}';save();R()">${v}</button>`).join("")}</div>`,oa=S.pf.prov=="oa",inp=(k,ph,t)=>`<input type=${t||"text"} placeholder="${ph}" value="${S.pf[k]||""}" onchange="S.pf.${k}=this.value.trim();save()">`;
 return`<h1>Settings</h1><h3>Skin tone</h3>${ch("skin",Object.keys(SKIN))}<h3>Season</h3>${ch("season",Object.keys(SEAS))}<h3>AI provider</h3>${seg([["gem","Gemini (free)"],["oa","Other"]],oa?"oa":"gem","setP")}
 ${oa?`<p class=mu>Any OpenAI-compatible service that accepts images, like Groq or OpenRouter. Keys stay on this phone.</p>${inp("url","Base URL, e.g. https://api.groq.com/openai/v1")}${inp("model","Vision model name")}${inp("key","API key","password")}`:`<p class=mu>Free key from aistudio.google.com/apikey. Stays on this phone.</p>${inp("key","Gemini API key","password")}${inp("model","Model (default gemini-flash-lite-latest)")}`}
 <p></p><button class=ghost onclick="if(confirm('Delete everything?')){S={items:[],pf:{},occ:'casual',jk:0};save();R()}">Reset all data</button>`}
function sheet(){if(!pend)return"";return`<div class=sheet><div class=card><img class=prev src="${pend.img}"><div class=row><i class="dot l" style="background:${pend.hex}"></i><b>${meta(pend).n}</b></div>

 <button class=pri onclick="saveP()">Save</button><button class=ghost onclick="pend=null;R()">Cancel</button></div></div>`}

 $("#n").innerHTML=[["out","Outfits"],["chk","Check"],["war","Wardrobe"],["set","Settings"]].map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';R()">${l}</button>`).join("")}

const b64=u=>({inline_data:{mime_type:"image/jpeg",data:u.split(",")[1]}});
async function ai(text,imgs,json,tries){const p=S.pf,c=new AbortController(),tm=setTimeout(()=>c.abort(),30000);try{let r,j;
 if(p.prov=="oa"){r=await fetch(p.url.replace(/\/$/,"")+"/chat/completions",{method:"POST",signal:c.signal,headers:{"Content-Type":"application/json",Authorization:"Bearer "+p.key},body:JSON.stringify({model:p.model,messages:[{role:"user",content:[{type:"text",text},...imgs.map(u=>({type:"image_url",image_url:{url:u}}))]}]})});
  j=await r.json();if(!r.ok)throw(j.error&&j.error.message)||r.status;return j.choices[0].message.content}
 const gc={responseMimeType:json?"application/json":"text/plain"};if(!tries)gc.thinkingConfig={thinkingBudget:0};
 r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${p.model||"gemini-flash-lite-latest"}:generateContent?key=${p.key}`,{method:"POST",signal:c.signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text},...imgs.map(b64)]}],generationConfig:gc})});
 j=await r.json();if(!r.ok){if(r.status==400&&!tries)return ai(text,imgs,json,1);throw(j.error&&j.error.message)||r.status}return j.candidates[0].content.parts.map(x=>x.text||"").join("")}
 catch(e){throw e.name=="AbortError"?"timed out":e}finally{clearTimeout(tm)}}
async function scan(it){const a=await ai(`This is a photo of a ${it.sec} (clothing item). Decide its TRUE fabric color as a person would see it in daylight, correcting for camera white balance, shadows and flash (a dark green shirt can look grey in photos; never answer grey unless it really is grey). Reply JSON only: {"type":"one of ${TY[it.sec].join("|")}","name":"specific color name like Dark Green, Burgundy, Mustard","hex":"#rrggbb of the true fabric color","pattern":"solid|striped|checked|printed"}`,[it.img],1);
 const j=JSON.parse(a.match(/\{[\s\S]*\}/)[0]);if(!/^#[0-9a-f]{6}$/i.test(j.hex))throw"unreadable answer";it.hex=j.hex.toLowerCase();it.name=j.name||"";it.pat=j.pattern||"solid";if(TY[it.sec].includes(j.type))it.type=j.type;it.ai=1}
async function rescan(){toast("Scanning...");try{await scan(pend);toast("Done")}catch(e){toast("AI: "+e)}R()}
async function review(a,b,c){const o=$("#rv");o.textContent="Reviewing...";const L=[g(a),g(b),c&&g(c)].filter(Boolean);try{o.textContent=await ai(`Occasion: ${S.occ}. Skin tone: ${S.pf.skin||"unspecified"}. Season: ${S.pf.season||"unspecified"}. These photos are the shirt, the pants${c?" and a jacket":""} of one outfit. Rate the whole outfit out of 10 and give 3 short styling tips (shoes, belt, watch). Plain text, no markdown.`,L.map(i=>i.img))}catch(e){o.textContent="AI: "+e}}
function detect(cv){const w=cv.width,h=cv.height,d=cv.getContext("2d").getImageData(w*.3,h*.3,w*.4,h*.4).data,b={};
 for(let i=0;i<d.length;i+=4){const k=(d[i]>>4)+","+(d[i+1]>>4)+","+(d[i+2]>>4);b[k]=b[k]||[0,0,0,0];b[k][0]+=d[i];b[k][1]+=d[i+1];b[k][2]+=d[i+2];b[k][3]++}
 const t=Object.values(b).sort((a,c)=>c[3]-a[3])[0],c=hsl([0,1,2].map(i=>t[i]/t[3]));if(c.s>.05&&c.l<.55)c.s=Math.min(1,c.s*1.6);return hx(c)}
async function toCanvas(f){let im;try{im=await createImageBitmap(f,{imageOrientation:"from-image"})}catch(e){im=new Image();im.src=URL.createObjectURL(f);await new Promise((a,b)=>{im.onload=a;im.onerror=()=>b("unsupported photo format")})}
 const k=Math.min(1,480/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);return cv}
$("#f").onchange=async e=>{const fs=[...e.target.files];e.target.value="";const q=[];
 for(const[i,f]of fs.entries()){try{const cv=await toCanvas(f);const it={id:Date.now()+i,sec:wsec,type:TY[wsec][0],hex:detect(cv),name:"",pat:"solid",img:cv.toDataURL("image/jpeg",.78),ai:0,st:hasAI()?1:0};S.items.push(it);q.push(it)}catch(x){toast("Could not read photo: "+(x.message||x))}}
 await save();R();let k=0;const w=async()=>{while(k<q.length){const it=q[k++];if(it.st)try{await scan(it)}catch(x){toast("AI: "+x)}it.st=0;await save();R()}};await Promise.all([w(),w()])};
(async()=>{try{const o=await idb("get","fc");if(o)S=o;else S.pf=JSON.parse(localStorage.fc).pf||{}}catch(e){}S.items.forEach(i=>i.st=0);if(S.pf.model&&/^gemini-flash-latest$/.test(S.pf.model))S.pf.model="";R()})();
